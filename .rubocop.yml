AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics:
  Enabled: false

Layout/LineLength:
  Max: 120

# git decides the line endings (.gitattributes); RuboCop's autocorrect on Windows writes CRLF, which this cop
# would then report and cannot repair.
Layout/EndOfLine:
  Enabled: false
